name: Hunter CI
on:
  push:
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      product_ref:
        type: string
        default: main
      candidate_repository:
        type: string
        default: ''
      candidate_revision:
        type: string
        default: ''
permissions:
  contents: read
concurrency:
  group: Hunter-${{ github.workflow }}-${{ github.ref }}-${{ inputs.candidate_repository }}
  cancel-in-progress: true
jobs:
  host:
    name: Hunter host checks
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/Hunter
          ref: ${{ inputs.product_ref || github.ref }}
          path: product
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch candidate staging tool
        if: inputs.candidate_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: main
          path: ci-tools
          sparse-checkout: tools/ci/test_dependency_candidate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage shared-library candidate in this temporary checkout
        if: inputs.candidate_repository != ''
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: python ci-tools/tools/ci/test_dependency_candidate.py
      - name: Run guards and host tests
        shell: bash
        run: |
          set -o pipefail
          cd product
          python -m unittest discover -s test -p test_dependencies_check.py 2>&1 | tee guard.log
          python test/run_host_tests.py 2>&1 | tee host.log
      - name: Save build results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-host-${{ github.run_id }}-${{ inputs.candidate_repository || 'pinned' }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            product/guard.log
            product/host.log
            product/candidate-validation.json
  firmware:
    name: Hunter firmware
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/Hunter
          ref: ${{ inputs.product_ref || github.ref }}
          path: product
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Fetch candidate staging tool
        if: inputs.candidate_repository != ''
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: mikevan/LayerTime
          ref: main
          path: ci-tools
          sparse-checkout: tools/ci/test_dependency_candidate.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - name: Stage shared-library candidate in this temporary checkout
        if: inputs.candidate_repository != ''
        env:
          PRODUCT_ROOT: ${{ github.workspace }}/product
          CANDIDATE_REPOSITORY: ${{ inputs.candidate_repository }}
          CANDIDATE_REVISION: ${{ inputs.candidate_revision }}
        run: python ci-tools/tools/ci/test_dependency_candidate.py
      - name: Install PlatformIO
        run: python -m pip install platformio==6.1.18
      - name: Build Hunter firmware
        shell: bash
        run: |
          set -o pipefail
          cd product
          pio run -e tdongle_c5_hunter -j 2 2>&1 | tee firmware.log
      - name: Save build results and logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: hunter-firmware-${{ github.run_id }}-${{ inputs.candidate_repository || 'pinned' }}
          retention-days: 14
          if-no-files-found: warn
          path: |
            product/firmware.log
            product/bin/build/tdongle_c5_hunter/firmware.bin
            product/bin/build/tdongle_c5_hunter/firmware.elf
            product/bin/build/tdongle_c5_hunter/bootloader.bin
            product/bin/build/tdongle_c5_hunter/partitions.bin
            product/candidate-validation.json
